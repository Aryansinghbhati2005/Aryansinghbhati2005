<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kingdom Siege - Clash Inspired Strategy Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Browser Strategy Demo</p>
        <h1>🏰 Kingdom Siege</h1>
        <p class="subtitle">A Clash-of-Clans-inspired village builder and raider</p>
      </div>
      <div class="actions">
        <button id="raidBtn" class="primary">⚔️ Raid Enemy</button>
        <button id="resetBtn" class="ghost">Reset Village</button>
      </div>
    </header>

    <main>
      <section class="card resources">
        <h2>Resources</h2>
        <div class="resource-grid" id="resourceGrid"></div>
      </section>

      <section class="card">
        <h2>Village Overview</h2>
        <div id="villageSummary" class="stats-grid"></div>
      </section>

      <section class="card">
        <h2>Buildings</h2>
        <div id="buildingsGrid" class="entity-grid"></div>
      </section>

      <section class="card">
        <h2>Army Camp</h2>
        <div id="troopsGrid" class="entity-grid"></div>
      </section>

      <section class="card battle-log">
        <h2>Battle Log</h2>
        <div id="battleLog"></div>
      </section>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>

    <footer>
      Build, train, raid, repeat. This is a lightweight demo and can be extended with multiplayer.
    </footer>

    <script src="app.js"></script>
  </body>
</html>
