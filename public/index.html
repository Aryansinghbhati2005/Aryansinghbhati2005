<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrap">
      <h1>🐍 Snake Game</h1>
      <p>Use arrow keys (or WASD) to move. Press Space to restart after game over.</p>

      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="bestScore">0</span></div>
      </div>

      <canvas id="gameCanvas" width="400" height="400" aria-label="Snake game board"></canvas>
      <p id="status" class="status">Press any arrow key to start.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
